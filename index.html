<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#081018" />
  <title>Temporarily Unavailable • M.A.R.S Companion</title>

  <style>
    :root{
      --bg:#081018;
      --bg-2:#060b11;
      --text:#ecf2f8;
      --muted:rgba(236,242,248,.72);
      --line:rgba(255,255,255,.10);
      --accent:#6df2c4;
      --shadow:0 18px 60px rgba(0,0,0,.38);
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      font-family:Inter, system-ui, sans-serif;
      color:var(--text);

      background:
        radial-gradient(1200px 600px at 15% 0%, rgba(111,242,196,.14), transparent 36%),
        radial-gradient(1000px 600px at 85% 10%, rgba(127,176,255,.10), transparent 32%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    }

    .card{
      width:min(700px, 100%);
      border:1px solid var(--line);
      border-radius:28px;
      background:rgba(255,255,255,.05);
      padding:42px;
      text-align:center;
      box-shadow:var(--shadow);
    }

    .eyebrow{
      font-size:.8rem;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:var(--muted);
      margin-bottom:18px;
    }

    h1{
      font-size:clamp(2.2rem, 5vw, 4rem);
      margin-bottom:18px;
      line-height:1.05;
    }

    p{
      font-size:1.05rem;
      line-height:1.8;
      color:var(--muted);
    }

    .contact{
      margin-top:26px;
      padding:18px;
      border-radius:18px;
      background:rgba(255,255,255,.03);
      border:1px solid var(--line);
    }

    .contact a{
      color:var(--accent);
      text-decoration:none;
    }

    .contact a:hover{
      text-decoration:underline;
    }

    .footer{
      margin-top:30px;
      font-size:.9rem;
      color:rgba(236,242,248,.45);
    }

    @media(max-width:768px){
      .card{
        padding:28px;
      }
    }
  </style>
</head>
<body>

  <div class="card">

    <div class="eyebrow">
      M.A.R.S. Companion
    </div>

    <h1>
      This website is currently unavailable.
    </h1>

    <p>
      We are performing updates and improvements.
      Please check back again later.
    </p>

    <div class="contact">
      <p>
        If you have any questions or suggestions, please contact us:
      </p>

      <p style="margin-top:10px;">
        <a href="mailto:contact@teduza.com">
          contact@teduza.com
        </a>
      </p>
    </div>

    <div class="footer">
      © 2026 Alexander Sarkisian • M.A.R.S. Companion
    </div>

  </div>

</body>
</html>
